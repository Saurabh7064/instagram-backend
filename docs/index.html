<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Saurabh's searchable Java, Spring Boot, system design, Kubernetes, DevOps, Kafka, and interview learning library."
    />
    <meta name="theme-color" content="#155eef" />
    <title>Instagram Backend Learning Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <link rel="stylesheet" href="assets/pages.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to lesson</a>
    <div id="app">Loading the learning library…</div>

    <script>
      const repositoryName = 'instagram-backend'
      const onProjectPages = window.location.hostname.endsWith('.github.io')
      const siteBasePath = onProjectPages ? `/${repositoryName}/` : '/'

      window.$docsify = {
        name: 'Learning Library',
        nameLink: '#/',
        repo: 'https://github.com/Saurabh7064/instagram-backend',
        basePath: siteBasePath,
        homepage: 'index.md',
        loadSidebar: true,
        alias: {
          '/.*/_sidebar.md': '/_sidebar.md',
        },
        auto2top: true,
        relativePath: true,
        routerMode: 'hash',
        maxLevel: 4,
        subMaxLevel: 3,
        notFoundPage: true,
        search: {
          paths: 'auto',
          placeholder: 'Search all lessons',
          noData: 'No matching lesson found',
          depth: 6,
        },
        copyCode: {
          buttonText: 'Copy',
          errorText: 'Could not copy',
          successText: 'Copied',
        },
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
  </body>
</html>
