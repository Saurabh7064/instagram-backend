spring.application.name=instagram-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/instagram}
spring.datasource.username=${DB_USERNAME:instagram}
spring.datasource.password=${DB_PASSWORD:instagram}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret=${APP_JWT_SECRET:instagram-dev-secret-key-change-me-at-least-32-bytes}
app.jwt.access-token-ttl-minutes=${APP_JWT_ACCESS_TOKEN_TTL_MINUTES:15}
