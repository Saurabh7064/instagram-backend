spring.application.name=instagram-backend
spring.application.version=${APP_VERSION:0.0.1-SNAPSHOT}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/instagram}
spring.datasource.username=${DB_USERNAME:instagram}
spring.datasource.password=${DB_PASSWORD:instagram}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret=${APP_JWT_SECRET:instagram-dev-secret-key-change-me-at-least-32-bytes}
app.jwt.access-token-ttl-minutes=${APP_JWT_ACCESS_TOKEN_TTL_MINUTES:15}
app.jwt.refresh-token-ttl-minutes=${APP_JWT_REFRESH_TOKEN_TTL_MINUTES:10080}
app.observability.metrics-token=${APP_OBSERVABILITY_METRICS_TOKEN:}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENVIRONMENT:local}
management.metrics.tags.version=${spring.application.version}
management.metrics.web.server.max-uri-tags=100
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.server.requests.active=false
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s

management.observations.key-values.application=${spring.application.name}
management.observations.key-values.environment=${APP_ENVIRONMENT:local}
management.observations.key-values.version=${spring.application.version}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:false}
management.otlp.metrics.export.enabled=${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
management.logging.export.otlp.enabled=${MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED:false}

logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=${spring.application.version}
logging.structured.ecs.service.environment=${APP_ENVIRONMENT:local}
logging.structured.ecs.service.node-name=${HOSTNAME:local}
logging.structured.json.stacktrace.max-length=4096
