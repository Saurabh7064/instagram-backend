spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.cors.allowed-origins=http://localhost:5173
app.jwt.secret=integration-test-secret-key-at-least-32-bytes
app.jwt.access-token-ttl-minutes=15

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.server.requests.active=false
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

logging.structured.format.console=ecs
logging.structured.ecs.service.name=instagram-backend-test
logging.structured.ecs.service.version=integration-test
logging.structured.ecs.service.environment=test
